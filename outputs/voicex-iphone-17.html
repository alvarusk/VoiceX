<div id="voicex-iphone-preview" class="viz-dotted-background">
  <style>
    #voicex-iphone-preview { display: grid; place-items: center; padding: 24px 8px; }
    #voicex-iphone-preview .vx-phone { --vx-bg: light-dark(#faf8ff,#121212); --vx-panel: light-dark(#f0edf5,#25232a); --vx-text: light-dark(#201c28,#ede8f3); --vx-muted: light-dark(#655f70,#bfb8ca); --vx-line: light-dark(#ccc4d5,#514a59); --vx-selected: light-dark(#e8ddff,#4b3b68); --vx-on-selected: light-dark(#25133f,#ecddff); box-sizing: border-box; width: min(100%,402px); min-height: 850px; border: 7px solid #38363b; border-radius: 54px; background: var(--vx-bg); color: var(--vx-text); font: 15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; overflow: hidden; box-shadow: 0 12px 30px #0002; }
    #voicex-iphone-preview .vx-status { height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 25px; position: relative; font-size: 14px; font-weight: 600; }
    #voicex-iphone-preview .vx-island { position: absolute; width: 112px; height: 31px; border-radius: 30px; background: #080809; left: 50%; transform: translateX(-50%); top: 11px; }
    #voicex-iphone-preview .vx-chrome { display: flex; align-items: center; gap: 4px; padding: 5px 10px 12px; }
    #voicex-iphone-preview button { font: inherit; color: inherit; cursor: inherit; }
    #voicex-iphone-preview .vx-icon { display: inline-flex; align-items: center; justify-content: center; padding: 10px; min-width: 44px; min-height: 44px; border: 0; background: transparent; border-radius: 24px; }
    #voicex-iphone-preview .vx-chrome strong { flex: 1; font-size: 18px; font-weight: 600; }
    #voicex-iphone-preview .vx-count { color: var(--vx-muted); font-size: 13px; white-space: nowrap; }
    #voicex-iphone-preview .vx-video { margin: 0 12px; height: 190px; border-radius: 12px; background: #18171c; color: #c7c1d1; display: grid; place-content: center; text-align: center; gap: 10px; }
    #voicex-iphone-preview .vx-video i { margin: auto; }
    #voicex-iphone-preview .vx-video span { font-size: 12px; }
    #voicex-iphone-preview .vx-playback { display: flex; justify-content: space-evenly; align-items: center; margin: 6px 12px 0; }
    #voicex-iphone-preview .vx-playback .vx-icon { padding: 8px; }
    #voicex-iphone-preview .vx-timing { text-align: center; font-size: 12px; color: var(--vx-muted); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
    #voicex-iphone-preview .vx-card { margin: 0 12px; padding: 14px; background: var(--vx-panel); border-radius: 14px; }
    #voicex-iphone-preview .vx-line-title { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; margin-bottom: 12px; }
    #voicex-iphone-preview .vx-field { display: block; position: relative; }
    #voicex-iphone-preview .vx-field > span { position: absolute; left: 12px; top: -9px; padding: 0 4px; background: var(--vx-panel); color: var(--vx-muted); font-size: 12px; }
    #voicex-iphone-preview select { appearance: auto; width: 100%; box-sizing: border-box; padding: 15px 12px; border: 1px solid var(--vx-line); border-radius: 5px; font: inherit; color: var(--vx-text); background: var(--vx-panel); }
    #voicex-iphone-preview .vx-source { padding: 20px 2px 18px; font-size: 18px; }
    #voicex-iphone-preview .vx-source small { display: block; font-size: 14px; color: var(--vx-muted); margin-top: 7px; }
    #voicex-iphone-preview .vx-flags { display: flex; gap: 12px; }
    #voicex-iphone-preview .vx-flag { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; border: 0; border-radius: 12px; background: var(--vx-line); color: var(--vx-text); font-weight: 600; }
    #voicex-iphone-preview .vx-flag[aria-pressed="true"] { background: var(--vx-selected); color: var(--vx-on-selected); }
    #voicex-iphone-preview .vx-mark { width: 21px; height: 21px; display: grid; place-items: center; border: 2px solid currentColor; border-radius: 50%; box-sizing: border-box; font-size: 12px; }
    #voicex-iphone-preview .vx-note { margin: 12px 0 0; min-height: 24px; font-size: 14px; overflow-wrap: anywhere; }
    #voicex-iphone-preview .vx-bottom { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; color: var(--vx-muted); }
    #voicex-iphone-preview .vx-home { width: 125px; height: 5px; border-radius: 8px; margin: 14px auto 10px; background: var(--vx-text); }
    @media (max-width: 370px) { #voicex-iphone-preview .vx-phone { border-width: 5px; } #voicex-iphone-preview .vx-card { margin: 0 8px; padding: 12px; } #voicex-iphone-preview .vx-chrome { gap: 0; padding-inline: 4px; } #voicex-iphone-preview .vx-count { font-size: 11px; } #voicex-iphone-preview .vx-chrome strong { font-size: 16px; } }
  </style>
  <section class="vx-phone" aria-label="Mockup de VoiceX en iPhone 17">
    <div class="vx-status"><span>9:41</span><span class="vx-island" aria-hidden="true"></span><span aria-label="Cobertura y batería">▮▮▮ · 100%</span></div>
    <div class="vx-chrome">
      <button type="button" class="vx-icon cursor-interaction" aria-label="Volver"><i data-lucide="chevron-left" aria-hidden="true"></i></button>
      <strong>Keroro · 042</strong>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Guardar en la nube"><i data-lucide="cloud-upload" aria-hidden="true"></i></button>
      <span class="vx-count">42 / 386</span>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Más opciones"><i data-lucide="ellipsis-vertical" aria-hidden="true"></i></button>
    </div>
    <div class="vx-video" aria-label="Espacio del vídeo del proyecto, en pausa"><i data-lucide="film" aria-hidden="true"></i><span>Vídeo del proyecto</span></div>
    <div class="vx-playback">
      <button type="button" class="vx-icon cursor-interaction" aria-label="Línea anterior"><i data-lucide="skip-back" aria-hidden="true"></i></button>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Retroceder cinco segundos"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Reproducir"><i data-lucide="play" aria-hidden="true"></i></button>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Avanzar cinco segundos"><i data-lucide="rotate-cw" aria-hidden="true"></i></button>
      <button type="button" class="vx-icon cursor-interaction" aria-label="Línea siguiente"><i data-lucide="skip-forward" aria-hidden="true"></i></button>
    </div>
    <div class="vx-timing">00:07:54.42 / 00:24:10.00</div>
    <div class="vx-card">
      <div class="vx-line-title"><span>Line 42 · 07:54.42 → 07:56.93</span><i data-lucide="flag" aria-hidden="true"></i></div>
      <label class="vx-field"><span>Actor</span><select aria-label="Actor"><option>Fuyuki</option><option>Keroro</option><option>Natsumi</option><option>Giroro</option><option>No actor</option></select></label>
      <div class="vx-source">こんな古いのも売ってんだ……。<small>konna furui no mo uttenda......</small></div>
      <div class="vx-flags" role="group" aria-label="Marcas de revisión">
        <button type="button" class="vx-flag cursor-interaction" data-flag="actor" aria-pressed="true"><span class="vx-mark" aria-hidden="true">✓</span>Actor</button>
        <button type="button" class="vx-flag cursor-interaction" data-flag="text" aria-pressed="true"><span class="vx-mark" aria-hidden="true">✓</span>Text</button>
      </div>
      <p class="vx-note" aria-live="polite">(Revisar actor y texto)</p>
    </div>
    <div class="vx-bottom"><span>Archivo de origen</span><span>ASS</span></div>
    <div class="vx-home" aria-hidden="true"></div>
  </section>
  <script>
    (() => {
      const root = document.getElementById('voicex-iphone-preview');
      const state = { actor: true, text: true };
      function render() {
        root.querySelectorAll('[data-flag]').forEach(button => {
          const active = state[button.dataset.flag];
          button.setAttribute('aria-pressed', String(active));
          button.querySelector('.vx-mark').textContent = active ? '✓' : '';
        });
        const annotation = state.actor && state.text ? 'Revisar actor y texto' : state.actor ? 'Revisar actor' : state.text ? 'Revisar texto' : '';
        root.querySelector('.vx-note').textContent = annotation ? '(' + annotation + ')' : '';
      }
      root.querySelectorAll('[data-flag]').forEach(button => button.addEventListener('click', () => {
        state[button.dataset.flag] = !state[button.dataset.flag];
        render();
      }));
      render();
    })();
  </script>
</div>
